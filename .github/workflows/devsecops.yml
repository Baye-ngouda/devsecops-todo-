name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: devsecops-todo

jobs:
  # 1. Qualité : lint + tests
  test:
    name: Test Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8
      - name: Lint
        run: flake8 app.py test_app.py --max-line-length 100
      - name: Tests
        run: python -m pytest -v

  # 2. Détection de secrets
  gitleaks:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3. SAST (bloque si une règle est déclenchée : --error)
  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Installer Semgrep
        run: pip install semgrep
      - name: Analyse
        run: semgrep scan --config p/python --config p/flask --error --json --output semgrep.json . || (semgrep scan --config p/python --config p/flask --error . ; exit 1)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapport-semgrep
          path: semgrep.json

  # 4. Dépendances (SCA) + Dockerfile (IaC) : CRITICAL/HIGH bloquent
  trivy-filesystem:
    name: SCA - Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scanner dépendances et configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # 5. Security gate 1 passée -> build + scan de l'image + test de démarrage
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, gitleaks, semgrep, trivy-filesystem]
    steps:
      - uses: actions/checkout@v7
      - name: Construire l'image
        run: docker build -t ${{ env.IMAGE_NAME }}:latest .
      - name: Test de démarrage (smoke test)
        run: |
          docker run -d --name todo -p 5000:5000 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true ${{ env.IMAGE_NAME }}:latest
          for i in $(seq 1 20); do
            curl -fsS http://localhost:5000/health && exit 0
            sleep 1
          done
          docker logs todo
          exit 1

  # 6. Scan de l'image : security gate 2
  container-scan:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v7
      - name: Construire l'image
        run: docker build -t ${{ env.IMAGE_NAME }}:latest .
      - name: Scanner l'image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # 7. SBOM
  sbom:
    name: SBOM - Trivy
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v7
      - name: Construire l'image
        run: docker build -t ${{ env.IMAGE_NAME }}:latest .
      - name: Générer le SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: cyclonedx
          output: sbom.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json

  # 8. CD : publication dans GHCR (uniquement si tout est vert, sur main)
  deploy:
    name: CD - GitHub Container Registry
    runs-on: ubuntu-latest
    needs: [container-scan, sbom]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nom d'image en minuscules (obligatoire pour Docker)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/devsecops-todo:latest
            ghcr.io/${{ env.OWNER }}/devsecops-todo:${{ github.sha }}
