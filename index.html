<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevSecOps Todo</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <h1>DevSecOps Todo</h1>
    <form action="{{ url_for('add') }}" method="post" class="add">
      <input type="text" name="title" placeholder="Nouvelle tâche" maxlength="200" required>
      <button type="submit">Ajouter</button>
    </form>
    <ul>
      {% for t in todos %}
      <li class="{{ 'done' if t.done else '' }}">
        <form action="{{ url_for('toggle', todo_id=t.id) }}" method="post">
          <button class="link" type="submit">{{ t.title }}</button>
        </form>
        <form action="{{ url_for('delete', todo_id=t.id) }}" method="post">
          <button class="del" type="submit" aria-label="Supprimer">✕</button>
        </form>
      </li>
      {% else %}
      <li class="empty">Aucune tâche pour le moment.</li>
      {% endfor %}
    </ul>
    <footer>v{{ version }}</footer>
  </main>
</body>
</html>
